	<style>
		:root {
			--space-1: 0.5rem;
			--space-2: 1rem;
			--space-3: 1.5rem;
			--space-4: 2rem;
			
			--lightness-base: 0.75;
			--chroma-base: 0.15;
			--hue-yellow: 110;
		}
		body {
			margin: 0;
			padding: var(--space-2);
			display: grid;
			place-items: center;
			min-height: 100vh;
			font-family: system-ui, sans-serif;
			font-size: 1rem;
			background-color: #f2f2f2;
			color: #1a1a1a;
		}
		main {
			display: grid;
			gap: var(--space-4);
			width: 100%;
			max-width: 40rem;
			text-align: center;
		}
		h1 {
			margin: 0;
			font-size: 2rem;
			display: flex;
			justify-content: center;
			align-items: center;
			gap: var(--space-1);
		}
		figure {
			position: relative;
			margin: 0;
			height: 8rem;
			border-radius: var(--space-1);
			overflow: hidden;
            border: 0.25rem solid #000000;
		}
		canvas {
			width: 100%;
			height: 100%;
			display: block;
		}
		figure::before {
			content: '';
			position: absolute;
			inset: 0;
			background-image: linear-gradient(
				to right,
				#000000d9 0%,
				#00000000 25%,
				#00000000 75%,
				#000000d9 100%
			);
			pointer-events: none;
			z-index: 1;
		}
		figure::after {
			content: '';
			position: absolute;
			left: 50%;
			top: 0;
			bottom: 0;
			width: 0.25rem;
			transform: translateX(-50%);
			background-color: #000000;
			z-index: 2;
		}
		fieldset {
			display: flex;
			flex-wrap: wrap;
			gap: var(--space-2);
			justify-content: center;
			align-items: center;
			border: none;
			padding: 0;
			margin: 0;
		}
		input, button {
			padding: var(--space-1) var(--space-2);
			font-size: 1.5rem;
			border-radius: var(--space-1);
			font-family: inherit;
		}
		input {
			width: 10rem;
			text-align: center;
			background-color: #ffffff;
			color: #1a1a1a;
			border: 0.1rem solid #cccccc;
		}
		button {
			cursor: pointer;
			font-weight: bold;
			border: none;
			transition: opacity 0.2s;
			background-color: #cccccc;
			color: #000000;
		}
		button:disabled, input:disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}
		output {
			font-size: 2rem;
			font-weight: bold;
			min-height: 3rem;
		}
		output[data-status='win'] {
			color: #22aa22;
		}
		output[data-status='loss'] {
			color: #dd3333;
		}
		output[data-status='neutral'] {
			color: inherit;
		}
		#taubenBucks {
			height: 2rem;
		}

		@media (prefers-color-scheme: dark) {
			body {
				background-color: #111111;
				color: #e6e6e6;
			}
			figure::after {
				background-color: #ffffff;
			}
			input {
				background-color: #333333;
				color: #e6e6e6;
				border-color: #4d4d4d;
			}
			button {
				background-color: #404040;
				color: #ffffff;
			}
			output[data-status='win'] {
				color: #55ff55;
			}
			output[data-status='loss'] {
				color: #ff5555;
			}
		}
	</style>

		<figure aria-label="Rainbow Slot Machine" role="img">
			<canvas id="slot-canvas" width="1000" height="100"></canvas>
		</figure>
		<fieldset>
			<label for="bet-input">Einsatz:</label>
			<input id="bet-input" type="text" inputmode="numeric" pattern="\d+" value="10">
			<button id="action-button" type="button">Spielen</button>
		</fieldset>
		<output id="result-output" data-status="neutral" aria-live="polite"></output>

	<script>
		const loadBalanceFromStorage = () => {
			const storedBalanceString = localStorage.getItem('taubenBucksBalance');
			if (storedBalanceString === null) {
				return 5000n;
			}
			try {
				return BigInt(storedBalanceString);
			} catch (errorObject) {
				return 5000n;
			}
		};

		const saveBalanceToStorage = (balanceBigInteger) => {
			localStorage.setItem('taubenBucksBalance', balanceBigInteger.toString());
		};

		const applicationState = {
			balanceBigInteger: loadBalanceFromStorage(),
			isSpinningBoolean: false,
			currentOffsetHueNumber: 0,
			optimalYellowHueBigInteger: 110n,
			colorLightnessString: '0.75',
			colorChromaString: '0.15'
		};

		const calculateShortestDistanceBigInteger = (currentHueBigInteger, targetHueBigInteger) => {
			const maximumHueBigInteger = 360n;
			let directDistanceBigInteger = currentHueBigInteger - targetHueBigInteger;
			
			if (directDistanceBigInteger < 0n) {
				directDistanceBigInteger = -directDistanceBigInteger;
			}
			
			const wrappedDistanceBigInteger = maximumHueBigInteger - directDistanceBigInteger;
			
			if (directDistanceBigInteger < wrappedDistanceBigInteger) {
				return directDistanceBigInteger;
			}
			
			return wrappedDistanceBigInteger;
		};

		const calculatePayoutBigInteger = (betBigInteger, distanceBigInteger) => {
			const maximumDistanceBigInteger = 180n;
			const fullCircleBigInteger = 360n;
			const distanceMultiplierBigInteger = 2n;
			const numeratorBigInteger = betBigInteger * (fullCircleBigInteger - (distanceMultiplierBigInteger * distanceBigInteger));
			return numeratorBigInteger / maximumDistanceBigInteger;
		};

		const parseCurrencyString = (currencyString) => {
			const sanitizedString = currencyString.trim();
			if (sanitizedString === '') {
				throw new Error('Einsatz leer.');
			}
			if (/^\d+$/.test(sanitizedString) === false) {
				throw new Error('Format ungültig. Nur ganze Zahlen.');
			}
			const parsedBigInteger = BigInt(sanitizedString);
			
			if (parsedBigInteger <= 0n) {
				throw new Error('Einsatz zu klein.');
			}
			return parsedBigInteger;
		};

		const formatCurrencyBigInteger = (currencyBigInteger) => {
			return currencyBigInteger.toString();
		};

		const calculateEasing = (timeProgressNumber) => {
			const invertedProgressNumber = 1 - timeProgressNumber;
			return 1 - (invertedProgressNumber * invertedProgressNumber * invertedProgressNumber);
		};

		const renderRainbowToCanvas = (canvasContext, canvasWidth, canvasHeight, startOffsetHueNumber, lightnessString, chromaString) => {
			const linearGradientObject = canvasContext.createLinearGradient(0, 0, canvasWidth, 0);
			const totalStepsNumber = canvasWidth;
			for (let stepIndexNumber = 0;
			stepIndexNumber <= totalStepsNumber;
			stepIndexNumber += 1) {
				const stopFractionNumber = stepIndexNumber / totalStepsNumber;
				const currentHueNumber = (startOffsetHueNumber + (stopFractionNumber * 360)) % 360;
				linearGradientObject.addColorStop(stopFractionNumber, 'oklch(' + lightnessString + ' ' + chromaString + ' ' + String(currentHueNumber) + ')');
			}
			canvasContext.fillStyle = linearGradientObject;
			canvasContext.fillRect(0, 0, canvasWidth, canvasHeight);
			
			const optimalHueNumber = Number(applicationState.optimalYellowHueBigInteger);
			const hueDistanceNumber = (optimalHueNumber - startOffsetHueNumber + 360) % 360;
			const markerPositionXNumber = (hueDistanceNumber / 360) * canvasWidth;
			
			canvasContext.fillStyle = 'oklch(0 0 0 / 0.3)';
			canvasContext.fillRect(markerPositionXNumber - 2, 0, 4, canvasHeight);
		};

		const updateDisplayElements = (balanceBigInteger, resultMessageString, resultStatusString) => {
			document.getElementById('balance-display').textContent = formatCurrencyBigInteger(balanceBigInteger);
			const outputElement = document.getElementById('result-output');
			outputElement.textContent = resultMessageString;
			outputElement.setAttribute('data-status', resultStatusString);
		};

		const setInterfaceDisabledState = (isDisabledBoolean) => {
			document.getElementById('action-button').disabled = isDisabledBoolean;
			document.getElementById('bet-input').disabled = isDisabledBoolean;
		};

		const finalizeSpin = (finalOffsetHueNumber, finalCenterHueNumber, betBigInteger) => {
			applicationState.currentOffsetHueNumber = finalOffsetHueNumber;
			const canvasElement = document.getElementById('slot-canvas');
			const canvasContext = canvasElement.getContext('2d');
			renderRainbowToCanvas(canvasContext, canvasElement.width, canvasElement.height, applicationState.currentOffsetHueNumber, applicationState.colorLightnessString, applicationState.colorChromaString);
			
			const targetHueBigInteger = BigInt(finalCenterHueNumber);
			const distanceBigInteger = calculateShortestDistanceBigInteger(targetHueBigInteger, applicationState.optimalYellowHueBigInteger);
			const payoutBigInteger = calculatePayoutBigInteger(betBigInteger, distanceBigInteger);
			
			applicationState.balanceBigInteger = applicationState.balanceBigInteger + payoutBigInteger;
			saveBalanceToStorage(applicationState.balanceBigInteger);
			
			const profitBigInteger = payoutBigInteger - betBigInteger;
			let messageString;
			let statusString;
			
			if (profitBigInteger > 0n) {
				messageString = '+' + formatCurrencyBigInteger(profitBigInteger) + ' Bucks';
				statusString = 'win';
			} else if (profitBigInteger < 0n) {
				const absoluteProfitBigInteger = -profitBigInteger;
				messageString = '-' + formatCurrencyBigInteger(absoluteProfitBigInteger) + ' Bucks';
				statusString = 'loss';
			} else {
				messageString = '±0 Bucks';
				statusString = 'neutral';
			}
			
			updateDisplayElements(applicationState.balanceBigInteger, messageString, statusString);
			setInterfaceDisabledState(false);
			applicationState.isSpinningBoolean = false;
		};

		const startAnimationLoop = (totalMovementNumber, betBigInteger, finalCenterHueNumber) => {
			const startTimestampNumber = performance.now();
			const durationNumber = 3000;
			const initialOffsetHueNumber = applicationState.currentOffsetHueNumber;
			const canvasElement = document.getElementById('slot-canvas');
			const canvasContext = canvasElement.getContext('2d');
			
			const animationStep = (currentTimestampNumber) => {
				const elapsedMilliseconds = currentTimestampNumber - startTimestampNumber;
				const timeProgressNumber = Math.min(elapsedMilliseconds / durationNumber, 1);
				const easedProgressNumber = calculateEasing(timeProgressNumber);
				
				const currentMovementNumber = totalMovementNumber * easedProgressNumber;
				applicationState.currentOffsetHueNumber = (initialOffsetHueNumber + currentMovementNumber) % 360;
				
				renderRainbowToCanvas(canvasContext, canvasElement.width, canvasElement.height, applicationState.currentOffsetHueNumber, applicationState.colorLightnessString, applicationState.colorChromaString);
				
				if (timeProgressNumber < 1) {
					requestAnimationFrame(animationStep);
				} else {
					finalizeSpin(applicationState.currentOffsetHueNumber, finalCenterHueNumber, betBigInteger);
				}
			};
			
			requestAnimationFrame(animationStep);
		};

		const handleActionClick = () => {
			if (applicationState.isSpinningBoolean === true) {
				return;
			}
			
			if (applicationState.balanceBigInteger === 0n) {
				updateDisplayElements(applicationState.balanceBigInteger, 'Bankrott! Bitte Seite laden.', 'loss');
				return;
			}
			
			const betInputString = document.getElementById('bet-input').value;
			let betBigInteger;
			
			try {
				betBigInteger = parseCurrencyString(betInputString);
			} catch (errorObject) {
				updateDisplayElements(applicationState.balanceBigInteger, errorObject.message, 'loss');
				return;
			}
			
			if (betBigInteger > applicationState.balanceBigInteger) {
				updateDisplayElements(applicationState.balanceBigInteger, 'Einsatz zu hoch.', 'loss');
				return;
			}
			
			applicationState.balanceBigInteger = applicationState.balanceBigInteger - betBigInteger;
			saveBalanceToStorage(applicationState.balanceBigInteger);
			updateDisplayElements(applicationState.balanceBigInteger, 'Viel Glück...', 'neutral');
			setInterfaceDisabledState(true);
			applicationState.isSpinningBoolean = true;
			
			const randomCenterHueNumber = Math.floor(Math.random() * 360);
			const targetOffsetHueNumber = (randomCenterHueNumber + 180) % 360;
			
			if (window.matchMedia('(prefers-reduced-motion: reduce)').matches === true) {
				finalizeSpin(targetOffsetHueNumber, randomCenterHueNumber, betBigInteger);
				return;
			}
			
			const totalMovementNumber = ((targetOffsetHueNumber - applicationState.currentOffsetHueNumber + 360) % 360) + (360 * 5);
			startAnimationLoop(totalMovementNumber, betBigInteger, randomCenterHueNumber);
		};

		const initializeApplication = () => {
			const computedStylesObject = getComputedStyle(document.documentElement);
			applicationState.colorLightnessString = computedStylesObject.getPropertyValue('--lightness-base').trim();
			applicationState.colorChromaString = computedStylesObject.getPropertyValue('--chroma-base').trim();
			applicationState.optimalYellowHueBigInteger = BigInt(computedStylesObject.getPropertyValue('--hue-yellow').trim());
			
			const canvasElement = document.getElementById('slot-canvas');
			renderRainbowToCanvas(canvasElement.getContext('2d'), canvasElement.width, canvasElement.height, applicationState.currentOffsetHueNumber, applicationState.colorLightnessString, applicationState.colorChromaString);
			
			document.getElementById('balance-display').textContent = formatCurrencyBigInteger(applicationState.balanceBigInteger);
			document.getElementById('action-button').addEventListener('click', handleActionClick);
		};

		initializeApplication();
	</script>
</body>
</html>
